services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - brybot_db_data:/var/lib/postgresql/data
    networks:
      - brybot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    build:
      context: .
    image: brybot-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TOPSTEP_USER: ${TOPSTEP_USER}
      TOPSTEP_API_KEY: ${TOPSTEP_API_KEY}
      TOPSTEP_ACCOUNT_ID: ${TOPSTEP_ACCOUNT_ID}
      TRADINGVIEW_API_KEY: ${TRADINGVIEW_API_KEY}
      TRADINGVIEW_BASE_URL: ${TRADINGVIEW_BASE_URL}
    networks:
      - brybot_internal
      - renace_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=RenaceNet
        - traefik.http.routers.brybot-api.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`) && PathPrefix(`/api`)
        - traefik.http.routers.brybot-api.entrypoints=websecure
        - traefik.http.routers.brybot-api.tls=true
        - traefik.http.routers.brybot-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.brybot-api.middlewares=brybot-api-strip
        - traefik.http.middlewares.brybot-api-strip.stripprefix.prefixes=/api
        - traefik.http.services.brybot-api.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: brybot-frontend:latest
    networks:
      - renace_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1

      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=RenaceNet
        - traefik.http.routers.brybot-web.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
        - traefik.http.routers.brybot-web.entrypoints=websecure
        - traefik.http.routers.brybot-web.tls=true
        - traefik.http.routers.brybot-web.tls.certresolver=letsencryptresolver
        - traefik.http.services.brybot-web.loadbalancer.server.port=80

volumes:
  brybot_db_data:

networks:
  brybot_internal:
    driver: overlay
  renace_net:
    external: true
    name: RenaceNet
